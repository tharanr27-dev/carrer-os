apiVersion: apps/v1
kind: Deployment
metadata:
  name: careeros-celery
  namespace: careeros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careeros-celery
  template:
    metadata:
      labels:
        app: careeros-celery
    spec:
      containers:
        - name: celery
          image: ${IMAGE_REGISTRY:-careeros-api}:latest
          command: ["celery", "-A", "app.modules.admin.tasks", "worker", "-l", "info"]
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/1
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
