[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "B"]
ignore = [
    "B008",  # FastAPI dependency injection intentionally uses Depends in defaults
    "B904",  # Existing API handlers intentionally hide auth parsing internals
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
ignore_errors = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = false
no_implicit_optional = false
namespace_packages = true
explicit_package_bases = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "htmlcov"]
skips = [
    "B101",
    "B105",  # Token labels and usage counters are false positives, not passwords
]
